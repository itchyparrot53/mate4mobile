name: Beta release

on:
  push:
    tags: ['v*-beta*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v||!/^\d+\.\d+\.\d+-beta(?:\.\d+)?$/.test(v))throw new Error('Tag must match a beta package version')"
          test -f "docs/releases/$RELEASE_TAG.md"
      - run: npm ci
      - run: npm test
      - run: npm run site
      - run: npm run check
      - run: npm run test:install
      - name: Package the checked revision
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/release
          git archive --format=zip --prefix=mate4mobile/ --output="dist/release/Mate4Mobile-$RELEASE_TAG-source.zip" HEAD
          git archive --format=zip --prefix=mate4mobile/ --output="dist/release/Mate4Mobile-$RELEASE_TAG-brand-kit.zip" HEAD brand LICENSE docs/legal
          (cd dist/site && zip -qr "../release/Mate4Mobile-$RELEASE_TAG-website.zip" .)
          (cd dist/release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish beta with downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > dist/release-state.txt; then
            if [ "$(cat dist/release-state.txt)" != "true" ]; then
              echo 'Release already published; leaving its assets unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Mate4Mobile ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.zip dist/release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
