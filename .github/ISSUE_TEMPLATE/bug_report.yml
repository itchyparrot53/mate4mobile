name: Bug report

description: Report a reproducible problem with sanitized details.
body:
  - type: markdown
    attributes:
      value: "Please remove credentials, VINs, home locations and real journey data. For vulnerabilities, follow .github/SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you expect, and what did you observe?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data or a minimal example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App/TeslaMate/PostgreSQL versions, Docker or native, browser/OS, and sanitized error.
    validations:
      required: true
